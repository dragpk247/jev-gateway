version: '3.8'

services:
  jev-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jev-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - JEV_API_KEY=${JEV_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Optional: mount local Obsidian Vault for knowledge RAG & auto write-back
      - ${HOME}/Documents/Obsidian Vault:/home/appuser/Documents/Obsidian Vault:rw
      # Optional: mount local database index
      - ${HOME}/.local/share/obsidian-ai-router:/home/appuser/.local/share/obsidian-ai-router:ro
